apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiperf-agentx
  labels:
    app: aiperf-agentx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aiperf-agentx
  template:
    metadata:
      labels:
        app: aiperf-agentx
    spec:
      containers:
      - name: aiperf
        # Official multi-architecture image; GB200 Grace nodes require arm64.
        image: nvcr.io/nvidia/ai-dynamo/aiperf:0.12.0
        imagePullPolicy: IfNotPresent
        command:
        - /opt/aiperf/venv/bin/python
        - -c
        - import time; time.sleep(10**9)
        workingDir: /workspace
        env:
        # OpenShift assigns an arbitrary UID, so caches must live on the
        # writable workspace volume rather than the image's /app home.
        - name: HOME
          value: /workspace
        - name: XDG_CACHE_HOME
          value: /workspace/.cache
        - name: AIPERF_DATASET_WEKA_LIVE_ASSISTANT_RESPONSES
          value: "1"
        - name: HF_HOME
          value: /workspace/.cache/huggingface
        envFrom:
        - secretRef:
            name: aiperf-hf-token
            optional: true
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
          limits:
            cpu: "16"
            memory: 32Gi
            ephemeral-storage: 20Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: workspace
        emptyDir:
          sizeLimit: 20Gi
