# OpenShift's owner-reference admission check requires delete authorization on
# a ComputeDomainClique before the daemon may update its ownerReferences. GPU
# Operator 26.7 currently omits delete from the generated daemon ClusterRole.
# Keep this supplemental role separate from the operator-owned ClusterRole.
# After creating run oc adm policy add-scc-to-user anyuid -z compute-domain-daemon-service-account -n nvidia-gpu-operator
# 
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: compute-domain-daemon-ownerref-workaround
rules:
- apiGroups:
  - resource.nvidia.com
  resources:
  - computedomaincliques
  verbs:
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: compute-domain-daemon-ownerref-workaround
subjects:
- kind: ServiceAccount
  name: compute-domain-daemon-service-account
  namespace: nvidia-gpu-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: compute-domain-daemon-ownerref-workaround
