apiVersion: v1
kind: Namespace
metadata:
  name: dynamic-mig-samples
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: mig-claim-any
  namespace: dynamic-mig-samples
spec:
  spec:
    devices:
      requests:
      - name: mig
        exactly:
          deviceClassName: mig.nvidia.com
---
apiVersion: v1
kind: Pod
metadata:
  name: mig-any
  namespace: dynamic-mig-samples
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: ctr
    image: nvcr.io/nvidia/cuda:12.4.0-base-ubi9
    command: ["sh", "-c", "nvidia-smi -L && sleep 300"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    resources:
      claims:
      - name: migdev
  resourceClaims:
  - name: migdev
    resourceClaimTemplateName: mig-claim-any
