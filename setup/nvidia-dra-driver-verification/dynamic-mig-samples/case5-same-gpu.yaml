apiVersion: v1
kind: Namespace
metadata:
  name: dynamic-mig-samples
---
# Constraints with matchAttribute ensure all slices come from the same parent GPU.
# An empty requests list means the constraint applies to all requests.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: mig-claim-same-gpu
  namespace: dynamic-mig-samples
spec:
  spec:
    devices:
      requests:
      - name: mig1
        exactly:
          deviceClassName: mig.nvidia.com
      - name: mig2
        exactly:
          deviceClassName: mig.nvidia.com
      constraints:
      - requests: []
        matchAttribute: "gpu.nvidia.com/parentUUID"
---
apiVersion: v1
kind: Pod
metadata:
  name: mig-same-gpu
  namespace: dynamic-mig-samples
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: ctr0
    image: nvcr.io/nvidia/cuda:12.4.0-base-ubi9
    command: ["sh", "-c", "nvidia-smi -L && sleep 300"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    resources:
      claims:
      - name: mig-slices
        request: mig1
  - name: ctr1
    image: nvcr.io/nvidia/cuda:12.4.0-base-ubi9
    command: ["sh", "-c", "nvidia-smi -L && sleep 300"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    resources:
      claims:
      - name: mig-slices
        request: mig2
  resourceClaims:
  - name: mig-slices
    resourceClaimTemplateName: mig-claim-same-gpu
