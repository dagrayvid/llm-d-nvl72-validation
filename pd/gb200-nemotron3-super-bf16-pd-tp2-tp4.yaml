# Two-node disaggregated prefill/decode deployment for GB200 NVL72.
#
# Topology:
#   prefill: 2 independent Pods x TP=2 x 2 GPUs = 4 GPUs
#   decode:  1 Pod             x TP=4 x 4 GPUs = 4 GPUs
#
# The decode Pod is pinned to gpu01. Both prefill Pods are pinned to gpu02 and
# share one named, node-local ComputeDomain channel claim. Replace the domainID
# placeholder with the UID of the live ComputeDomain before applying this file.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: nemotron3-super-pd-prefill-shared-channel
  namespace: dagray-dev
spec:
  devices:
    config:
    - opaque:
        driver: compute-domain.nvidia.com
        parameters:
          allocationMode: Single
          apiVersion: resource.nvidia.com/v1beta1
          domainID: REPLACE_WITH_COMPUTE_DOMAIN_UID
          kind: ComputeDomainChannelConfig
      requests:
      - channel
    requests:
    - name: channel
      exactly:
        deviceClassName: compute-domain-default-channel.nvidia.com
        allocationMode: ExactCount
        count: 1
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: nemotron3-super-pd
  namespace: dagray-dev
spec:
  model:
    name: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16
    uri: pvc://mx-model-cache/NVIDIA-Nemotron-3-Super-120B-A12B-BF16

  router:
    gateway: {}
    route: {}
    scheduler:
      template:
        containers:
        - name: main

  # Decode: one Pod using four GPUs with TP=4.
  replicas: 1
  template:
    nodeSelector:
      kubernetes.io/hostname: redhat-gb200-validation-gpu01
    resourceClaims:
    - name: gpus
      resourceClaimTemplateName: nemotron3-super-pd-gpus-tp4
    - name: compute-domain-channel
      resourceClaimTemplateName: nemotron3-super-pd-compute-domain-channel
    containers:
    - name: main
      image: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.5.1-1788369031
      env:
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      # Required for NIXL transfer of Mamba conv state between TP2 and TP4.
      - name: VLLM_SSM_CONV_STATE_LAYOUT
        value: DS
      - name: UCX_CUDA_IPC_ENABLE_MNNVL
        value: "y"
      - name: VLLM_ENGINE_READY_TIMEOUT_S
        value: "3600"
      - name: NCCL_MNNVL_ENABLE
        value: "1"
      - name: NCCL_NVLS_ENABLE
        value: "1"
      - name: NCCL_CUMEM_ENABLE
        value: "1"
      - name: NCCL_P2P_LEVEL
        value: NVL
      - name: GLOO_SOCKET_IFNAME
        value: eth0
      - name: NCCL_SOCKET_IFNAME
        value: eth0
      - name: VLLM_ADDITIONAL_ARGS
        value: >-
          --tensor-parallel-size 4
          --dtype auto
          --kv-cache-memory-bytes 64G
          --max-model-len 262144
          --block-size 128
          --kv-cache-dtype fp8
          --mamba-ssm-cache-dtype float32
          --no-disable-hybrid-kv-cache-manager
          --async-scheduling
          --enable-chunked-prefill
          --max-cudagraph-capture-size 128
          --trust-remote-code
          --reasoning-parser nemotron_v3
          --enable-auto-tool-choice
          --tool-call-parser qwen3_coder
          --enable-cumem-allocator
          --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail"}'
      resources:
        claims:
        - name: gpus
        - name: compute-domain-channel
        requests:
          cpu: "16"
          memory: 32Gi
      # The routing sidecar occupies 8000 in decode Pods; vLLM uses 8001.
      startupProbe:
        httpGet:
          path: /health
          port: 8001
          scheme: HTTPS
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 270
      volumeMounts:
      - name: dshm
        mountPath: /dev/shm
    volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi

  # Prefill: two independent Pods sharing gpu02's IMEX channel.
  prefill:
    replicas: 2
    template:
      nodeSelector:
        kubernetes.io/hostname: redhat-gb200-validation-gpu02
      resourceClaims:
      - name: gpus
        resourceClaimTemplateName: nemotron3-super-pd-gpus-tp2
      - name: compute-domain-channel
        resourceClaimName: nemotron3-super-pd-prefill-shared-channel
      containers:
      - name: main
        image: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.5.1-1788369031
        env:
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        # Required for NIXL transfer of Mamba conv state between TP2 and TP4.
        - name: VLLM_SSM_CONV_STATE_LAYOUT
          value: DS
        - name: UCX_CUDA_IPC_ENABLE_MNNVL
          value: "y"
        - name: VLLM_ENGINE_READY_TIMEOUT_S
          value: "3600"
        - name: NCCL_MNNVL_ENABLE
          value: "1"
        - name: NCCL_NVLS_ENABLE
          value: "1"
        - name: NCCL_CUMEM_ENABLE
          value: "1"
        - name: NCCL_P2P_LEVEL
          value: NVL
        - name: GLOO_SOCKET_IFNAME
          value: eth0
        - name: NCCL_SOCKET_IFNAME
          value: eth0
        - name: VLLM_ADDITIONAL_ARGS
          value: >-
            --tensor-parallel-size 2
            --dtype auto
            --kv-cache-memory-bytes 64G
            --max-model-len 262144
            --block-size 128
            --kv-cache-dtype fp8
            --mamba-ssm-cache-dtype float32
            --no-disable-hybrid-kv-cache-manager
            --async-scheduling
            --enable-chunked-prefill
            --max-cudagraph-capture-size 128
            --trust-remote-code
            --reasoning-parser nemotron_v3
            --enable-auto-tool-choice
            --tool-call-parser qwen3_coder
            --enable-cumem-allocator
            --moe-backend triton
            --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_load_failure_policy":"fail"}'
        resources:
          claims:
          - name: gpus
          - name: compute-domain-channel
          requests:
            cpu: "16"
            memory: 32Gi
        # Prefill Pods have no routing sidecar, so vLLM serves HTTPS on 8000.
        startupProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 270
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
